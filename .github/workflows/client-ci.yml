name: Client CI (Unity)

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/**'

jobs:
  validate:
    name: Validate Unity Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity project structure
        run: |
          echo "Checking Unity project structure..."
          test -d client/Assets || (echo "Missing Assets folder" && exit 1)
          test -d client/ProjectSettings || (echo "Missing ProjectSettings folder" && exit 1)
          echo "Unity project structure is valid"

