version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: volution-postgres
    environment:
      POSTGRES_USER: volution
      POSTGRES_PASSWORD: volution_dev
      POSTGRES_DB: volution
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volution"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: volution-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development only - Adminer for database management
  adminer:
    image: adminer
    container_name: volution-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_data:
